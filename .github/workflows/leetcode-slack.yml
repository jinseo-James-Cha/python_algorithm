name: LeetCode Slack Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Problem Info
        id: problem
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep -E '^[0-9]{4}-' | head -1)

          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIR=$(echo "$FILE" | cut -d'/' -f1)

          NUMBER=$(echo "$DIR" | cut -d'-' -f1)
          SLUG=$(echo "$DIR" | cut -d'-' -f2-)

          TITLE=$(echo "$SLUG" \
            | sed 's/-/ /g' \
            | sed -E 's/(^| )(.)/\1\u\2/g')

          echo "found=true" >> $GITHUB_OUTPUT
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Send Slack Message
        if: steps.problem.outputs.found == 'true'
        run: |
          MESSAGE="Daily Challenge - LeetCode Solved

          #${{ steps.problem.outputs.number }} - ${{ steps.problem.outputs.title }}

          👤 Author: James

          🔗 https://leetcode.com/problems/${{ steps.problem.outputs.slug }}
          "

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}